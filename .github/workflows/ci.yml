name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 20.12 is the documented floor (@clack/prompts requires it); 22 and 24
        # guard against regressions on current releases.
        node: ['20.12', '22', '24']
        include:
          # Windows matters: the generated mvnw.cmd / gradlew.bat are only
          # exercised by a real Windows run.
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Generated projects default to Java 21, so the runner needs a JDK at
      # least that new. Without this the smoke build fails with
      # "release version 21 not supported".
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke test the CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

      # Generates real projects and builds them, so a broken template or a bad
      # plugin version fails CI rather than a user's first run.
      - name: Generate and build a Maven project
        if: runner.os == 'Linux'
        run: |
          node dist/cli.js smoke-maven --maven --dep lombok --no-git --no-color
          cd smoke-maven && ./mvnw -B -q package -DskipTests

      - name: Generate and build a Gradle project
        if: runner.os == 'Linux'
        run: |
          node dist/cli.js smoke-gradle --gradle --dsl kotlin --no-git --no-color
          cd smoke-gradle && ./gradlew --no-daemon -q build -x test

      - name: Generate and build a Spring Boot project
        if: runner.os == 'Linux'
        run: |
          node dist/cli.js smoke-boot --spring-boot --boot-dep web --no-git --no-color
          cd smoke-boot && ./mvnw -B -q package -DskipTests
