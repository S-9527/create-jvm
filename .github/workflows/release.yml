name: Release

# Publishes to npm when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
# Requires an NPM_TOKEN repository secret (an npm automation token).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # prepublishOnly rebuilds, so dist/ is always current.
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm pack --dry-run
